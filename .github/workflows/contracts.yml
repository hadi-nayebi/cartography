name: Public and control-plane contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run non-secret contract tests
        run: >-
          node --test
          pipeline/auth/*.test.mjs
          pipeline/community/*.test.mjs
          pipeline/operations/*.test.mjs
          pipeline/public/*.test.mjs
          pipeline/publish/*.test.mjs
          pipeline/subscribers/*.test.mjs
          pipeline/sources/nyc-libraries.test.mjs
          pipeline/sources/library-geography.test.mjs
      - name: Validate repository production records
        shell: bash
        run: |
          for normalized in data/*/normalized; do
            slug="${normalized#data/}"
            slug="${slug%/normalized}"
            node pipeline/validate.mjs "$slug"
          done

      - name: Verify frozen library source and site groups
        run: |
          node pipeline/sources/nyc-libraries.mjs
          node pipeline/sources/verify-library-geography.mjs
          git diff --exit-code -- data/nyc-libraries/derived/libraries.json
